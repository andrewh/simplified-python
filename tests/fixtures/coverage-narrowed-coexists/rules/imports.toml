[[rule]]
id = "SP601"
slug = "no-star-import"
category = "imports"
construct = "Star import."
anchor = { nodes = ["alias"], attribute = "name", value = "*" }
status = "banned"
rationale = "Fixture."
principles = ["P1"]
replacement = "Import names explicitly."
compliant = ["from os import path\n"]
violating = ["from os import *\n"]

[[rule]]
id = "SP602"
slug = "relative-imports"
category = "imports"
construct = "Star import."
anchor = { nodes = ["ImportFrom"], attribute = "level" }
status = "restricted"
rationale = "Fixture."
principles = ["P1"]
compliant = ["from . import x\n"]
violating = ["from .. import x\n"]
condition = "At most one leading dot."
