# Append-only ledger of every rule identifier ever issued.
#
# Rule identifiers are public API: reviewers cite them and tools emit them.
#
# - When you add a rule, append its identifier to `ids`. Never reorder or delete entries.
# - When you remove a rule, keep its identifier in `ids` and add a [[retired]] entry.
#   A retired identifier is never assigned to another rule.
#
# Validation fails when a ledger identifier matches neither exactly one rule nor one
# retired entry, and when a rule or retired entry is missing from the ledger.

