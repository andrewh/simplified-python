name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Validate registry
        run: uv run python -m simplified_python.registry --check
      - name: Test
        run: uv run pytest
      - name: Check reference is up to date
        run: uv run python -m simplified_python.reference --check
      - name: Check agent skill is up to date
        run: uv run python -m simplified_python.skill --check
